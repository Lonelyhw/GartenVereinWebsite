name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend - mvn test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gv_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d gv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: mvn -q test

  frontend:
    name: Frontend - ng build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm run test:ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration production

  e2e:
    name: E2E - Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost/api/actuator/health | python - <<'PY'
              import json
              import sys

              try:
                  data = json.load(sys.stdin)
              except Exception:
                  sys.exit(1)

              sys.exit(0 if data.get("status") == "UP" else 1)
PY
            then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          docker compose logs --tail=200
          exit 1
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Run E2E
        working-directory: frontend
        run: npm run e2e

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build --no-cache
