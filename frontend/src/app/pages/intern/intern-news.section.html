<section class='space-y-6'>
  <div class='flex items-center justify-between'>
    <h2 class='text-xl font-semibold text-slate-900'>News verwalten</h2>
    <button
      class='rounded-full bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700'
      type='button'
      (click)='startCreate()'
    >
      Neu
    </button>
  </div>

  <div *ngIf='errorMessage' class='rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700'>
    {{ errorMessage }}
  </div>

  <div *ngIf='formOpen' class='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm'>
    <div class='grid gap-4'>
      <div>
        <label class='text-sm font-semibold text-slate-700'>Titel</label>
        <input
          class='mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700'
          type='text'
          [(ngModel)]='form.title'
        />
      </div>
      <div>
        <label class='text-sm font-semibold text-slate-700'>Inhalt</label>
        <textarea
          class='mt-1 min-h-[120px] w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700'
          [(ngModel)]='form.content'
        ></textarea>
        <div class='mt-2 flex items-center gap-2 text-sm text-slate-600'>
          <input type='checkbox' [(ngModel)]='preview' />
          Vorschau anzeigen
        </div>
        <div
          *ngIf='preview'
          class='mt-3 space-y-2 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700'
          [innerHTML]='renderMarkdown(form.content)'
        ></div>
      </div>
      <label class='inline-flex items-center gap-2 text-sm text-slate-700'>
        <input type='checkbox' [(ngModel)]='form.published' />
        Veroeffentlicht
      </label>
    </div>
    <div class='mt-4 flex gap-3'>
      <button
        class='rounded-full bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700'
        type='button'
        (click)='save()'
      >
        Speichern
      </button>
      <button
        class='rounded-full border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100'
        type='button'
        (click)='cancel()'
      >
        Abbrechen
      </button>
    </div>
  </div>

  <div *ngIf='loading' class='grid gap-4'>
    <div class='h-20 rounded-2xl border border-slate-200 bg-white/80 p-4 shadow-sm'></div>
    <div class='h-20 rounded-2xl border border-slate-200 bg-white/80 p-4 shadow-sm'></div>
  </div>

  <div *ngIf='!loading && newsItems.length === 0' class='rounded-2xl border border-slate-200 bg-white p-4 text-sm text-slate-600 shadow-sm'>
    Keine Beitraege vorhanden.
  </div>

  <div *ngIf='!loading && newsItems.length > 0' class='space-y-4'>
    <article
      *ngFor='let item of newsItems'
      class='rounded-2xl border border-slate-200 bg-white p-5 shadow-sm'
    >
      <div class='flex items-start justify-between gap-4'>
        <div>
          <h3 class='text-lg font-semibold text-slate-900'>{{ item.title }}</h3>
          <p class='mt-1 text-xs uppercase tracking-wide text-slate-400'>
            {{ item.createdAt | date: 'dd.MM.yyyy HH:mm' }}
          </p>
        </div>
        <span
          class='rounded-full px-2.5 py-0.5 text-xs font-semibold uppercase tracking-wide'
          [class]='item.published ? "bg-emerald-50 text-emerald-700" : "bg-slate-100 text-slate-500"'
        >
          {{ item.published ? 'Published' : 'Draft' }}
        </span>
      </div>
      <p class='mt-3 text-sm text-slate-600'>{{ item.content }}</p>
      <div class='mt-4 flex gap-3'>
        <button
          class='rounded-full border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100'
          type='button'
          (click)='startEdit(item)'
        >
          Bearbeiten
        </button>
        <button
          class='rounded-full border border-rose-200 px-4 py-2 text-sm font-semibold text-rose-700 hover:bg-rose-50'
          type='button'
          (click)='delete(item)'
        >
          Loeschen
        </button>
      </div>
    </article>
  </div>
</section>
