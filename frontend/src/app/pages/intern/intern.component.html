<section class='space-y-8'>
  <div class='rounded-2xl border border-slate-200 bg-white px-6 py-8 shadow-sm'>
    <h1 class='text-3xl font-semibold tracking-tight text-slate-900'>Vorstand intern</h1>
    <p class='mt-2 text-base text-slate-600'>Admin-Dashboard fuer News und Inhalte.</p>
  </div>

  <div class='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm'>
    <div class='flex flex-col gap-4 md:flex-row md:items-center md:justify-between'>
      <div>
        <h2 class='text-lg font-semibold text-slate-900'>Admin Login</h2>
        <p class='text-sm text-slate-600'>Basic Auth fuer Schreibzugriffe.</p>
      </div>
      <div *ngIf='signedIn' class='text-sm text-emerald-700'>Angemeldet als {{ username }}</div>
    </div>

    <div class='mt-4 grid gap-4 md:grid-cols-3'>
      <div>
        <label class='text-sm font-semibold text-slate-700'>Username</label>
        <input
          class='mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700'
          type='text'
          [(ngModel)]='username'
        />
      </div>
      <div>
        <label class='text-sm font-semibold text-slate-700'>Password</label>
        <input
          class='mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700'
          type='password'
          [(ngModel)]='password'
        />
      </div>
      <label class='mt-6 inline-flex items-center gap-2 text-sm text-slate-600'>
        <input type='checkbox' [(ngModel)]='remember' />
        Merken
      </label>
    </div>

    <div class='mt-4 flex flex-wrap gap-3'>
      <button
        class='rounded-full bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700'
        type='button'
        (click)='login()'
      >
        Anmelden
      </button>
      <button
        class='rounded-full border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100'
        type='button'
        (click)='logout()'
      >
        Abmelden
      </button>
    </div>
  </div>

  <app-intern-news-section />

  <div class='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm'>
    <h2 class='text-xl font-semibold text-slate-900'>Dokumente</h2>
    <div class='mt-4 grid gap-4 md:grid-cols-2'>
      <div>
        <label class='text-sm font-semibold text-slate-700'>Titel</label>
        <input class='mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700' [(ngModel)]='docTitle' />
      </div>
      <div>
        <label class='text-sm font-semibold text-slate-700'>Kategorie</label>
        <input class='mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700' [(ngModel)]='docCategory' />
      </div>
      <div class='md:col-span-2'>
        <label class='text-sm font-semibold text-slate-700'>Beschreibung</label>
        <textarea class='mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700' [(ngModel)]='docDescription'></textarea>
      </div>
      <div class='md:col-span-2'>
        <input type='file' accept='application/pdf' (change)='onDocFileSelected($event)' />
      </div>
    </div>
    <button class='mt-4 rounded-full bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700' type='button' (click)='saveDocument()'>
      Speichern
    </button>

    <div class='mt-6 space-y-2 text-sm text-slate-600'>
      <div *ngFor='let doc of documents$ | async'>
        {{ doc.title }} ({{ doc.category }})
      </div>
    </div>
  </div>

  <div class='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm'>
    <h2 class='text-xl font-semibold text-slate-900'>Aushaenge</h2>
    <div class='mt-4 grid gap-4 md:grid-cols-2'>
      <div>
        <label class='text-sm font-semibold text-slate-700'>Titel</label>
        <input class='mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700' [(ngModel)]='noticeTitle' />
      </div>
      <div class='md:col-span-2'>
        <label class='text-sm font-semibold text-slate-700'>Hinweis (optional)</label>
        <textarea class='mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700' [(ngModel)]='noticeContent'></textarea>
      </div>
      <div class='md:col-span-2'>
        <input type='file' accept='image/jpeg,image/png,image/webp' (change)='onNoticeFileSelected($event)' />
      </div>
    </div>
    <button class='mt-4 rounded-full bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700' type='button' (click)='saveNotice()'>
      Speichern
    </button>

    <div class='mt-6 space-y-2 text-sm text-slate-600'>
      <div *ngFor='let notice of notices$ | async'>
        {{ notice.title }}
      </div>
    </div>
  </div>
</section>
