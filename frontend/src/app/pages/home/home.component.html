<section class='space-y-12'>
  <div class='rounded-3xl border border-slate-200 bg-white px-6 py-10 shadow-sm md:px-12 md:py-14'>
    <div class='max-w-3xl space-y-4'>
      <p class='text-xs font-semibold uppercase tracking-[0.3em] text-emerald-700'>Kleingartenverein</p>
      <h1 class='text-4xl font-semibold tracking-tight text-slate-900 md:text-5xl'>
        Herzlich Willkommen
      </h1>
      <p class='text-base text-slate-600 md:text-lg'>
        Der Kleingartenverein am Heidensee e.V. bietet Gruen, Gemeinschaft und Raum fuer Erholung.
        Entdecken Sie aktuelle Hinweise, Veranstaltungen und Angebote rund um unser Vereinsleben.
      </p>
    </div>
  </div>

  <div class='space-y-6'>
    <div class='flex items-center justify-between'>
      <h2 class='text-2xl font-semibold tracking-tight text-slate-900'>Wichtige Bereiche</h2>
      <span class='text-sm text-slate-500'>Schnellzugriff</span>
    </div>

    <div class='grid gap-6 md:grid-cols-2 lg:grid-cols-3'>
      <ng-container *ngFor='let card of cards'>
        <app-image-card
          *ngIf='!card.adminOnly || admin'
          [title]='card.title'
          [description]='card.description'
          [href]='card.route'
          [imageUrl]='card.imageUrl'
          [badge]='card.badge'
        />
      </ng-container>
    </div>
  </div>
</section>
