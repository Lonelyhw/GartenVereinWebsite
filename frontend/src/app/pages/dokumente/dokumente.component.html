<section class='animate-fade-in-up space-y-10'>
  <div class='rounded-2xl border border-slate-200 bg-white px-6 py-8 shadow-sm'>
    <h1 class='text-3xl font-semibold tracking-tight text-slate-900'>Dokumente</h1>
    <p class='mt-2 text-base text-slate-600'>Formulare, Satzung und wichtige Unterlagen.</p>
  </div>

  <div class='space-y-4' data-testid='documents-section'>
    <h2 class='text-xl font-semibold text-slate-900'>Downloads</h2>

    <div *ngIf='documents$ | async as documents'>
      <div *ngIf='documents.length === 0' class='rounded-2xl border border-slate-200 bg-white p-6 text-sm text-slate-600 shadow-sm'>
        Noch keine Dokumente vorhanden.
      </div>

      <div *ngIf='documents.length > 0' class='stagger grid gap-6 sm:grid-cols-2 lg:grid-cols-3' data-testid='documents-list'>
        <a
          *ngFor='let doc of documents'
          class='group rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-emerald-200 hover:shadow-md'
          [href]='doc.fileUrl'
          target='_blank'
          rel='noopener'
          data-testid='document-item'
        >
          <div class='flex items-start justify-between gap-3'>
            <div class='text-xs uppercase tracking-wide text-slate-400'>{{ doc.category }}</div>
            <span
              class='flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 transition-colors group-hover:bg-emerald-600 group-hover:text-white'
            >
              <app-icon name='download' [size]='16' />
            </span>
          </div>
          <h3 class='mt-2 text-lg font-semibold text-slate-900 group-hover:underline'>{{ doc.title }}</h3>
          <p class='mt-2 text-sm text-slate-600'>{{ doc.description }}</p>
        </a>
      </div>
    </div>
  </div>
</section>
