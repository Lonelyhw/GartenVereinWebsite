<section class='space-y-6' *ngIf='state$ | async as state'>
  <div *ngIf='state.status === "loading"' class='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm'>
    <div class='h-6 w-2/3 rounded bg-slate-200'></div>
    <div class='mt-4 h-4 w-32 rounded bg-slate-200'></div>
    <div class='mt-6 h-4 w-full rounded bg-slate-200'></div>
    <div class='mt-2 h-4 w-5/6 rounded bg-slate-200'></div>
  </div>

  <div *ngIf='state.status === "notFound"' class='rounded-2xl border border-slate-200 bg-white p-6 text-sm text-slate-600 shadow-sm'>
    Beitrag nicht gefunden.
  </div>

  <article *ngIf='state.status === "loaded"' class='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm'>
    <h1 class='text-3xl font-semibold tracking-tight text-slate-900'>{{ state.item.title }}</h1>
    <p class='mt-2 text-xs uppercase tracking-wide text-slate-400'>
      {{ state.item.createdAt | date: 'dd.MM.yyyy' }}
    </p>
    <p class='mt-6 whitespace-pre-line text-base text-slate-700'>{{ state.item.content }}</p>
  </article>
</section>
