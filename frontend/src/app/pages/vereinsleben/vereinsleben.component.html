<section class='animate-fade-in-up space-y-10'>
  <div class='rounded-2xl border border-slate-200 bg-white px-6 py-8 shadow-sm'>
    <h1 class='text-3xl font-semibold tracking-tight text-slate-900'>Vereinsleben</h1>
    <p class='mt-2 text-base text-slate-600'>Termine, Aktionen und gemeinschaftliche Projekte.</p>
  </div>

  <div class='space-y-4'>
    <h2 class='text-xl font-semibold text-slate-900'>Veranstaltungen</h2>
    <div class='stagger space-y-3'>
      <div class='flex gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition duration-200 hover:border-emerald-200 hover:shadow-md'>
        <span class='flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600'>
          <app-icon name='calendar' [size]='20' />
        </span>
        <div class='min-w-0 flex-1'>
          <div class='flex items-center justify-between text-sm text-slate-500'>
            <span>--.--.----</span>
            <span>Platzhalter</span>
          </div>
          <h3 class='mt-1 text-lg font-semibold text-slate-900'>Sommerfest</h3>
          <p class='mt-1 text-sm text-slate-600'>Kurzer Hinweis zu Ablauf und Ort.</p>
        </div>
      </div>
      <div class='flex gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition duration-200 hover:border-emerald-200 hover:shadow-md'>
        <span class='flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600'>
          <app-icon name='calendar' [size]='20' />
        </span>
        <div class='min-w-0 flex-1'>
          <div class='flex items-center justify-between text-sm text-slate-500'>
            <span>--.--.----</span>
            <span>Platzhalter</span>
          </div>
          <h3 class='mt-1 text-lg font-semibold text-slate-900'>Arbeitseinsatz</h3>
          <p class='mt-1 text-sm text-slate-600'>Kurzer Hinweis zu Treffpunkt und Aufgaben.</p>
        </div>
      </div>
    </div>
  </div>
</section>
