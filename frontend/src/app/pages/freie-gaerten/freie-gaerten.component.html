<section class='animate-fade-in-up space-y-10'>
  <div class='rounded-2xl border border-slate-200 bg-white px-6 py-8 shadow-sm'>
    <h1 class='text-3xl font-semibold tracking-tight text-slate-900'>Freie Gaerten</h1>
    <p class='mt-2 text-base text-slate-600'>Informationen zu freien Parzellen und Bewerbungen.</p>
    <button
      class='group mt-4 inline-flex items-center justify-center gap-2 rounded-full bg-emerald-600 px-5 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-700 hover:shadow-md active:scale-[0.98]'
      type='button'
    >
      <app-icon name='mail' [size]='16' />
      Kontakt aufnehmen
      <app-icon
        name='arrow-right'
        [size]='16'
        className='transition-transform duration-200 group-hover:translate-x-1'
      />
    </button>
  </div>

  <div class='stagger grid gap-6 md:grid-cols-2'>
    <div class='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition duration-200 hover:border-emerald-200 hover:shadow-md'>
      <h2 class='text-xl font-semibold text-slate-900'>Voraussetzungen</h2>
      <p class='mt-3 text-sm text-slate-600'>Platzhalter fuer Kriterien und Ablauf.</p>
    </div>
    <div class='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition duration-200 hover:border-emerald-200 hover:shadow-md'>
      <h2 class='text-xl font-semibold text-slate-900'>Aktueller Stand</h2>
      <p class='mt-3 text-sm text-slate-600'>Platzhalter fuer Anzahl freier Parzellen.</p>
    </div>
  </div>
</section>
