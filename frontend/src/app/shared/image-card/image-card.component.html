<ng-container *ngIf='isArrayLink; else stringLink'>
  <a
    class='group block overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-[1px] hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2'
    [routerLink]='href'
  >
    <div class='relative h-40 md:h-44 lg:h-48' [ngStyle]='backgroundStyle'>
      <div class='absolute inset-0 bg-gradient-to-t from-slate-900/40 via-slate-900/10 to-transparent'></div>
    </div>
    <div class='space-y-2 px-5 py-4'>
      <div class='flex items-center justify-between gap-3'>
        <h3 class='text-lg font-semibold text-slate-900 group-hover:underline'>{{ title }}</h3>
        <span
          *ngIf='badge'
          class='rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold uppercase tracking-wide text-emerald-700'
        >
          {{ badge }}
        </span>
      </div>
      <p class='text-sm text-slate-600'>{{ description }}</p>
    </div>
  </a>
</ng-container>

<ng-template #stringLink>
  <a
    class='group block overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-[1px] hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2'
    [routerLink]='href'
  >
    <div class='relative h-40 md:h-44 lg:h-48' [ngStyle]='backgroundStyle'>
      <div class='absolute inset-0 bg-gradient-to-t from-slate-900/40 via-slate-900/10 to-transparent'></div>
    </div>
    <div class='space-y-2 px-5 py-4'>
      <div class='flex items-center justify-between gap-3'>
        <h3 class='text-lg font-semibold text-slate-900 group-hover:underline'>{{ title }}</h3>
        <span
          *ngIf='badge'
          class='rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold uppercase tracking-wide text-emerald-700'
        >
          {{ badge }}
        </span>
      </div>
      <p class='text-sm text-slate-600'>{{ description }}</p>
    </div>
  </a>
</ng-template>
